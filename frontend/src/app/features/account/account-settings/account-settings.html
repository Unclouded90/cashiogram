<app-settings-page>
  <app-card>
    <section class="account-settings">
      <h1>Account Settings</h1>

      @if (account(); as accountData) {
        <div class="account-form">
          <label for="initial-balance">Initial Balance</label>

          <input
            id="initial-balance"
            type="number"
            step="0.01"
            [value]="accountData.initialBalance"
            #initialBalance
          />

          <button type="button" class="btn-primary" (click)="updateAccount(initialBalance.value)">
            Update Account
          </button>
        </div>
      } @else {
        <div class="account-form">
          <label for="initial-balance">Initial Balance</label>

          <input id="initial-balance" type="number" step="0.01" #initialBalance />

          <button type="button" (click)="createAccount(initialBalance.value)">
            Create Account
          </button>
        </div>
      }
    </section>
  </app-card>
</app-settings-page>
