<section class="transactions">
  <header class="transactions-header">
    <h2>Transactions</h2>

    <div class="transactions-actions">
      <button type="button">Filters</button>
      <button type="button">List</button>
      <button type="button">Grid</button>
    </div>
  </header>

  <div class="transactions-content">
    <div class="transaction-form">
      <input type="number" step="0.01" min="0.01" placeholder="Amount" #amount />

      <select #transactionType>
        <option value="EXPENSE">Expense</option>
        <option value="INCOME">Income</option>
      </select>

      <select #category>
        <option value="" disabled selected>Category</option>

        @for (categoryItem of categories(); track categoryItem.id) {
          <option [value]="categoryItem.id">
            {{ categoryItem.name }}
          </option>
        }
      </select>

      <input class="date-input" type="date" #date />

      <input type="text" placeholder="Description" #description />

      <button
        type="button"
        (click)="createTransaction(amount, transactionType, category, date, description)"
      >
        Add Transaction
      </button>
    </div>
    @for (transaction of transactions(); track transaction.id) {
      <app-card>
        @if (editingTransactionId() === transaction.id) {
          <div class="transaction-edit">
            <input type="number" step="0.01" min="0.01" [value]="transaction.amount" #editAmount />

            <select [value]="transaction.transactionType" #editType>
              <option value="EXPENSE">Expense</option>
              <option value="INCOME">Income</option>
            </select>

            <select [value]="transaction.categoryId" #editCategory>
              @for (category of categories(); track category.id) {
                <option [value]="category.id">
                  {{ category.name }}
                </option>
              }
            </select>

            <input type="date" [value]="transaction.date" #editDate />

            <input type="text" [value]="transaction.description ?? ''" #editDescription />

            <button
              type="button"
              (click)="
                updateTransaction(
                  transaction.id,
                  editAmount,
                  editType,
                  editCategory,
                  editDate,
                  editDescription
                )
              "
            >
              Save
            </button>
          </div>
        } @else {
          <div class="transaction-item">
            <app-transaction-row
              [type]="transaction.transactionType"
              [date]="transaction.date"
              [category]="categoryNames().get(transaction.categoryId) ?? 'Unknown Category'"
              [description]="transaction.description"
              [amount]="transaction.amount"
            />

            <div class="transaction-actions">
              <button type="button" (click)="editTransaction(transaction.id)">Edit</button>

              <button type="button" (click)="deleteTransaction(transaction.id)">Delete</button>
            </div>
          </div>
        }
      </app-card>
    }
  </div>
</section>
