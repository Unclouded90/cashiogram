<app-settings-page>
  <app-card>
    <section class="categories">
      <h1>Categories</h1>

      <div class="category-form">
        <input type="text" placeholder="Name" #categoryName />

        <input
          class="description-input"
          type="text"
          placeholder="Description"
          #categoryDescription
        />

        <button
          type="button"
          class="btn-primary"
          (click)="createCategory(categoryName, categoryDescription)"
        >
          Add Category
        </button>
      </div>

      <div class="categories-list">
        @for (category of categories(); track category.id) {
          <a class="category-card" [routerLink]="['/settings/categories', category.id]">
            <strong>{{ category.name }}</strong>

            @if (category.description) {
              <span>{{ category.description }}</span>
            }
          </a>
        } @empty {
          <p>No categories yet.</p>
        }
      </div>
    </section>
  </app-card>
</app-settings-page>
